# Telegram (secrets like API id/hash/session live in .env or GitHub Secrets)
telegram:
  source_chat: "me" # "me" = your own Saved Messages, shared with the other pipelines.
  require_tag: "ig2:" # Only videos whose caption starts with this tag belong to this (2nd) Instagram account. Tag is stripped off before use as the topic.

# No shop for this account: it is a pure content account (Snapchat best-friends-list tips).
product:
  enabled: false

# What this account is about. The AI keeps every caption on-topic for this audience and ends with the CTA.
niche:
  description: "how to see and understand the Snapchat best friends (BSF) list: what the emojis and best-friends order mean, where to find the list in the app, and Snapchat settings/tips"
  cta: "Follow for more Snapchat tips"
  rules: "Only describe things Snapchat officially shows or lets users do. Never promise ways to see private information, never mention hacks, spy tools, third-party apps or logins, no fake claims about what a specific person does. Do NOT write step-by-step instructions or app menu paths (the video shows the steps and you cannot verify them): hint at what the video reveals instead. Hashtags: never use words like hack, secret, spy or stalk, and never a year. No URLs in the caption."

# AI Configuration (Groq, free tier)
ai:
  text_model: "openai/gpt-oss-120b"

# Trending signal
keywords:
  max_trending: 10 # Google Trends rising/top related queries to feed the AI

# Safety limits
limits:
  max_uploads_per_run: 3

# Drip-feed schedule: if you send several videos at once, this spaces out the
# actual publishing instead of uploading them all back-to-back.
schedule:
  post_interval_hours: 0 # Minimum hours between two uploads. 0 = disabled (post as soon as found).

# Paths (relative to project root)
paths:
  state_file: "data/state.json"
  downloads_dir: "downloads"
